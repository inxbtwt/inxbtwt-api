spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 42MB
  application:
    name: inxbtwt-api
  profiles:
    default: dev
  config:
    import: classpath:routers-security.yaml
  cloud:
    openfeign:
      client:
        config:
          search-api:
            connectTimeout: 3000
            readTimeout: 5000
server:
  port: 8081

app:
  search-api:
    url: ${SEARCH_API_URL:http://localhost:8083}
  feed:
    default-strategy: chronological
