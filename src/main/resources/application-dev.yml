management:
  otlp:
    metrics:
      export:
        enabled: false

app:
  storage:
    s3:
      endpoint: http://localhost:8333
      region: us-east-1
      access-key: test
      secret-key: test
      bucket: inxbtwt-files
  bucket-urls:
    photo-profile: img/profile/photo/
    cover-profile: img/profile/cover/photo/

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rsdb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
