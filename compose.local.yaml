services:
  api-db-init:
    image: 'postgres:18'
    environment:
      PGHOST: postgres
      PGDATABASE: rsdb
      PGUSER: admin
      PGPASSWORD: admin
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-c', 'CREATE SCHEMA IF NOT EXISTS api_local_test']
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: 'true'
  api:
    image: 'inxbtwt-api:${API_IMAGE_TAG:-local-test}'
    build:
      context: .
      args:
        APP_VERSION: '${API_IMAGE_TAG:-local-test}'
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rsdb?currentSchema=api_local_test
      APP_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      APP_SECURITY_CORS_ALLOWED_ORIGINS: '${APP_SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:4200}'
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      api-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/8081"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    labels:
      org.springframework.boot.ignore: 'true'
  tunnel:
    image: 'cloudflare/cloudflared:2026.9.3'
    command: ['tunnel', '--no-autoupdate', '--url', 'http://api:8081']
    depends_on:
      api:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: 'true'
  seaweedfs:
    image: 'chrislusf/seaweedfs:4.48'
    entrypoint: ['/bin/sh', '/dev-tools/start-seaweedfs.sh']
    command: ['mini', '-dir=/data', '-ip=seaweedfs', '-ip.bind=0.0.0.0', '-webdav=false', '-admin.ui=false', '-s3.port.iceberg=0', '-s3.port.lance=0']
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
      - ./dev-tools:/dev-tools:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:9333/cluster/status && nc -z localhost 8333']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=rsdb'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=admin'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d rsdb']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  seaweedfs-data:
  postgres-data:
